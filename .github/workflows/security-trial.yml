name: Free security scanner trial

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - name: Install pinned free tools and rules
        run: python3 scripts/security-trial-setup.py "$RUNNER_TEMP/security-tools"
      - name: Test report boundaries and process failures
        if: ${{ !cancelled() }}
        run: node --test tests/security-trial.test.mjs
      - name: Verify isolated detector fixtures
        if: ${{ !cancelled() }}
        run: node scripts/security-trial.mjs verify --tools-dir "$RUNNER_TEMP/security-tools"
      - name: Scan tracked HEAD snapshot
        if: ${{ !cancelled() }}
        run: node scripts/security-trial.mjs scan --tools-dir "$RUNNER_TEMP/security-tools"
      - name: Publish sanitized summaries
        if: always()
        run: |
          test -f .security-trial/verify.json
          test -f .security-trial/scan.json
          cat .security-trial/verify-summary.txt
          cat .security-trial/scan-summary.txt
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-trial-sanitized
          if-no-files-found: error
          retention-days: 7
          path: |
            .security-trial/verify.json
            .security-trial/scan.json
            .security-trial/verify-summary.txt
            .security-trial/scan-summary.txt
